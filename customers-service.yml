spring:
  config:
    activate:
      on-profile: default
eureka:
  instance:
    instance-id: ${spring.application.name}:${random.uuid}
    preferIpAddress: false  # Preferir nombres en lugar de IPs
    hostname: customers-service  # Nombre del servicio en Kubernetes
  client:
    serviceUrl:
      defaultZone: http://discovery-server:8761/eureka/

---
spring:
  config:
    activate:
      on-profile: docker
  application:
      name: customers-service
  zipkin:
    baseUrl: http://tracing-server:9411
server:
  port: 8081
eureka:
  instance:
    preferIpAddress: false
    hostname: customers-service  # Asegúrate de que se use el nombre del servicio
  client:
    serviceUrl:
      defaultZone: http://discovery-server:8761/eureka/
