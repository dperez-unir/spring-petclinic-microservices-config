apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: petclinic-automation
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: spring-petclinic-config
  update:
    path: ./
    strategy: Setters
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: david.perez945@comunidadunir.net
        name: david-unir
      messageTemplate: "ci: update images"  # Usa comillas dobles aquí para evitar problemas con los caracteres especiales.
    push:
      branch: main
  dependsOn:
    - name: admin-server-policy
    - name: api-gateway-policy
    - name: config-server-policy
    - name: customers-service-policy
    - name: discovery-server-policy
    - name: vets-service-policy
    - name: visits-service-policy