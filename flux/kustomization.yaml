apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: petclinic-kustomization
  namespace: flux-system
spec:
  interval: 1m
  path: ./flux/  # Ajusta esta ruta a donde están tus manifiestos dentro del repo2
  prune: true
  sourceRef:
    kind: GitRepository
    name: spring-petclinic-config
  wait: true