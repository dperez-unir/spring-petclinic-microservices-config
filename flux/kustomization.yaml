apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: petclinic-kustomization
  namespace: flux-system
spec:
  interval: 1m
  path: ./flux/
  prune: true
  sourceRef:
    kind: GitRepository
    name: spring-petclinic-config
  wait: true
  dependsOn:
    - name: petclinic-automation