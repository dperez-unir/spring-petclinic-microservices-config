apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: petclinic-kustomization
  namespace: flux-system
spec:
  interval: 1m
  path: ./
  prune: true
  sourceRef:
    kind: GitRepository
    name: spring-petclinic-config
  wait: true
  dependsOn:
    - name: petclinic-automation